<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Teaser</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="1"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage" class="abs"></div>
      <div id="band" class="abs"></div>
      <!-- AUDIO:START -->
      <!-- AUDIO:END -->
    </div>
    <script src="data.js"></script>
    <script>
      // ---- template constants (report-agnostic) ----
      const C = {
        bg: "#fbfbfa",
        ink: "#1d2330",
        mute: "#5b6577",
        line: "#d3dae4",
        blue: "#0a5fc4",
        teal: "#0d6e67",
        purple: "#7042c9",
        orange: "#a84a0c",
        good: "#0e7040",
      };
      const LEAD = 0.3; // a visual change lands this long before the word it illustrates
      const XFADE = 0.4; // scene crossfade in the gap between beats
      const D = window.TEASER;

      const el = (tag, cls, parent, css = {}, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        Object.assign(n.style, css);
        if (text !== undefined) n.textContent = text;
        parent.appendChild(n);
        return n;
      };
      const svgEl = (tag, parent, attrs = {}) => {
        const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
        Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
        parent.appendChild(n);
        return n;
      };
      const norm = (w) => w.replace(/[^\w']/g, "").toLowerCase();
      // absolute time of the nth caption word matching token; fail loudly on a data mismatch
      const wordAt = (b, token, nth = 0) => {
        const hits = b.words.filter((w) => norm(w.w) === token.toLowerCase());
        if (hits.length <= nth) throw new Error(`beat ${b.id}: word "${token}" #${nth} not in caption`);
        return hits[nth].s;
      };
      const cue = (b, token, nth = 0) => wordAt(b, token, nth) - LEAD;
      // the node holds its "from" state until it pops in (otherwise it shows from the scene start)
      const popIn = (n, at, from = { opacity: 0, y: 24 }) =>
        tl.set(n, from, 0) && tl.fromTo(n, from, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, at);
      const drawLine = (path, at, dur = 0.4) => {
        const len = path.getTotalLength();
        path.style.strokeDasharray = `${len}`;
        path.style.strokeDashoffset = `${len}`;
        tl.to(path, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, at);
      };
      // a palette key from the data ("blue", "good", ...) or a literal colour
      const col = (name) => C[name] || name;
      // scene heading: eyebrow, then the headline when a title is given; returns the headline node
      const head = (root, eyebrow, title) => {
        const h = el("div", "abs head", root);
        if (eyebrow) el("div", "t-eyebrow", h, {}, eyebrow);
        return title === undefined ? null : el("div", "t-h1", h, {}, title);
      };

    </script>
    <script src="scenes.js"></script>
    <script>
      // the one paused timeline; helpers above and scenes.js add to it when the build below calls them
      const tl = gsap.timeline({ paused: true });
      // ================= ui scene (generic, driven by tour data) =================
      const SHOT_W = 1568;
      const SHOT_H = 882;
      const BOX_PAD = 0.04; // pad the box by this share of the still width on each side
      const DIM_PAD = 0.015; // the dimmed hole hugs the box more tightly than the zoom region
      const WIDE = 0.65; // a padded box wider than this share of the still frames its text instead
      const TEXT_SPAN = 1.15; // ...with a view this many times the text width
      const ZOOM_MIN_W = 0.4; // ...but at least this share of the still width
      const BOX_EXTRA_H = 0.08; // view height is at least the box height plus this share of the still height
      const ZOOM_DUR = 1.0;
      function padBox(box, [sw, sh], pad = BOX_PAD) {
        const p = sw * pad;
        return { x0: Math.max(0, box.x0 - p), y0: Math.max(0, box.y0 - p), x1: Math.min(sw, box.x1 + p), y1: Math.min(sh, box.y1 + p) };
      }
      // the 16:9 view the camera fills the card with (fill 1.0), clamped inside the still
      function zoomView(box, text, [sw, sh]) {
        const pb = padBox(box, [sw, sh]);
        let w = pb.x1 - pb.x0;
        let cx = (pb.x0 + pb.x1) / 2;
        if (w > sw * WIDE) {
          w = Math.max(TEXT_SPAN * (text.x1 - text.x0), sw * ZOOM_MIN_W);
          cx = (text.x0 + text.x1) / 2;
        }
        const h = Math.min(sh, Math.max((w * 9) / 16, box.y1 - box.y0 + sh * BOX_EXTRA_H));
        w = Math.min(sw, (h * 16) / 9);
        const vh = (w * 9) / 16;
        const x = Math.min(Math.max(cx - w / 2, 0), sw - w);
        const y = Math.min(Math.max((box.y0 + box.y1) / 2 - vh / 2, 0), sh - vh);
        return { x, y, w, h: vh };
      }
      function sceneUi(root, b) {
        const u = b.ui;
        const shot = el("div", "abs card shot", root);
        const cam = el("div", "abs cam", shot);
        cam.setAttribute("data-layout-allow-overflow", ""); // the camera moves a 4K still inside the card
        const s0 = SHOT_W / u.size[0];
        const after = el("img", "", cam);
        after.src = u.after;
        after.alt = "";
        const pb = padBox(u.box, u.size, DIM_PAD);
        const spot = el("div", "abs spot", cam, { left: pb.x0 + "px", top: pb.y0 + "px", width: pb.x1 - pb.x0 + "px", height: pb.y1 - pb.y0 + "px" });
        tl.set(cam, { x: 0, y: 0, scale: s0 }, 0);
        tl.set(spot, { opacity: 0 }, 0);
        popIn(shot, b.start, { opacity: 0, y: 30, scale: 0.98 });
        let free = b.start + 0.5;
        if (u.before) {
          const before = el("img", "", cam);
          before.src = u.before;
          before.alt = "";
          const press = u.clickAt - LEAD;
          pressRipple(shot, u.click.x * s0, u.click.y * s0, press);
          tl.fromTo(before, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.inOut", immediateRender: false }, press + 0.15);
          free = press + 0.6;
        }
        // the zoom settles LEAD s before the anchor word and holds to the end of the beat
        const land = u.focusAt - LEAD;
        const start = Math.min(Math.max(free, land - ZOOM_DUR), land - 0.5);
        const v = zoomView(u.box, u.text, u.size);
        const s1 = SHOT_W / v.w;
        tl.fromTo(cam, { x: 0, y: 0, scale: s0 }, { x: -v.x * s1, y: -v.y * s1, scale: s1, duration: land - start, ease: "power2.inOut", immediateRender: false }, start);
        tl.to(spot, { opacity: 1, duration: 0.5, ease: "power1.out" }, land - 0.25);
      }

      // press-ripple (catalog block, ported inline): decel arrival, lockstep press, two click rings, exit
      function pressRipple(parent, x, y, pressAt) {
        const rings = svgEl("svg", parent, { class: "abs", width: SHOT_W, height: SHOT_H, style: "left:0;top:0;overflow:visible" });
        const rs = [1, 0.6].map(() => svgEl("circle", rings, { cx: x, cy: y, r: 16, fill: "none", stroke: C.blue, "stroke-width": 3, opacity: 0 }));
        const cur = el("div", "abs cursor", parent, { left: (-5 / 24) * 60 + "px", top: (-3 / 24) * 60 + "px", transformOrigin: `${(5 / 24) * 60}px ${(3 / 24) * 60}px` });
        cur.setAttribute("data-layout-allow-overflow", ""); // parks off-card before and after the press
        const svg = svgEl("svg", cur, { viewBox: "0 0 24 24" });
        svgEl("path", svg, { d: "M5 3 L5 19 L9 15 L12 22 L15 20.5 L11.5 14 L18 14 Z", fill: "#ffffff", stroke: C.ink, "stroke-width": 1.4, "stroke-linejoin": "round" });
        const lx = x + 3;
        const ly = y + 4;
        tl.fromTo(cur, { x: SHOT_W * 1.08, y: SHOT_H * 1.1 }, { x: lx, y: ly, duration: 0.45, ease: "power3.out", immediateRender: false }, pressAt - 0.6);
        tl.set(cur, { x: SHOT_W * 1.08, y: SHOT_H * 1.1 }, 0);
        tl.to(cur, { scale: 0.93, duration: 0.12, ease: "power1.in" }, pressAt);
        tl.to(cur, { scale: 1, duration: 0.42, ease: "back.out(1.8)" }, pressAt + 0.14);
        rs.forEach((r, i) => {
          const at = pressAt + 0.12 + i * 0.06;
          tl.fromTo(r, { attr: { r: 16 } }, { attr: { r: 72 }, duration: 0.32, ease: "power2.out", immediateRender: false }, at);
          tl.fromTo(r, { opacity: [1, 0.6][i] }, { opacity: 0, duration: 0.32, ease: "power1.in", immediateRender: false }, at);
        });
        tl.fromTo(cur, { x: lx, y: ly }, { x: SHOT_W * 1.08, y: SHOT_H * 1.1, duration: 0.4, ease: "power2.in", immediateRender: false }, pressAt + 0.4);
      }

      // ================= assembly =================
      // centre a scene's content in the stage area (layout boxes, transforms ignored; full-frame SVG layers skipped)
      const STAGE_H = 900;
      function centreScene(root) {
        let top = Infinity;
        let bottom = -Infinity;
        for (const n of root.children) {
          if (n.tagName.toLowerCase() === "svg" || !n.offsetHeight) continue;
          top = Math.min(top, n.offsetTop);
          bottom = Math.max(bottom, n.offsetTop + n.offsetHeight);
        }
        if (!(top < bottom)) return;
        const shift = Math.round((STAGE_H - (top + bottom)) / 2);
        root.style.top = shift + "px";
        root.style.height = STAGE_H - shift + "px"; // keep the scene box inside the stage
      }
      const stage = document.getElementById("stage");
      D.beats.forEach((b, i) => {
        const next = D.beats[i + 1];
        const root = el("div", "abs scene", stage);
        const type = b.kind === "ui" ? "ui" : b.scene && b.scene.type;
        const build = type === "ui" ? sceneUi : window.SCENES[type];
        if (!build) throw new Error(`beat ${b.id}: no scene type "${type}"`);
        build(root, b);
        centreScene(root);
        if (i === 0) tl.set(root, { opacity: 1 }, 0);
        else tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: XFADE, ease: "power1.inOut", immediateRender: false }, b.start - XFADE / 2);
        if (next) tl.to(root, { opacity: 0, duration: XFADE, ease: "power1.inOut" }, next.start - XFADE / 2);
      });

      // captions: one phrase at a time; upcoming words muted, the active word in accent, spoken words in ink
      const band = document.getElementById("band");
      const CAPTION_LEAD = 0.05; // the highlight leads the audio by about one frame and a half
      D.beats.forEach((b) =>
        b.phrases.forEach((p) => {
          const box = el("div", "abs phrase", band);
          const para = el("p", "", box);
          p.wi.forEach((k, j) => {
            const w = b.words[k];
            if (j) para.appendChild(document.createTextNode(" "));
            const span = el("span", "", para, {}, w.w);
            tl.set(span, { color: C.blue }, w.s - CAPTION_LEAD);
            tl.set(span, { color: C.ink }, w.e - CAPTION_LEAD);
          });
          tl.set(box, { opacity: 1 }, p.show);
          tl.set(box, { opacity: 0 }, p.hide);
        }),
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
