<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Teaser</title>
    <!-- pinned: the browser refuses a changed file (integrity), so a CDN compromise cannot run code in the render -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js" integrity="sha384-Sjkr6w0fFKkxtEQY7MVGUGYK7lNjV5adCOLTzv8eBXdW2xDCLMNz5mo+iXchMXTh" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="1"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage" class="abs"></div>
      <div id="band" class="abs"></div>
      <!-- AUDIO:START -->
      <!-- AUDIO:END -->
    </div>
    <script src="data.js"></script>
    <script>
      // ---- template constants (report-agnostic) ----
      // colours come from the look tokens in style.css, overridden per video by theme.css (build.py, from direction.json)
      const TOKENS = getComputedStyle(document.documentElement);
      const tok = (k) => TOKENS.getPropertyValue("--" + k).trim();
      const C = Object.fromEntries(
        ["bg", "surface", "ink", "mute", "line", "accent", "em", "blue", "teal", "purple", "orange", "good"].map((k) => [k, tok(k)]),
      );
      C.onAccent = tok("on-accent");
      gsap.registerPlugin(CustomEase);
      // motion vocabulary (Material 3 shapes): entrances decelerate, exits accelerate, moves use the emphasized curve
      const ENTER = CustomEase.create("enter", "0.05,0.7,0.1,1");
      const EXIT = CustomEase.create("exit", "0.3,0,0.8,0.15");
      const MOVE = CustomEase.create("move", "0.2,0,0,1");
      const LEAD = 0.3; // a visual change lands this long before the word it illustrates
      const EXIT_DUR = 0.3; // "calm" transition: the outgoing scene leaves (ease-in) before the boundary...
      const ENTER_DUR = 0.4; // ...and the next enters after it
      const D = window.TEASER;
      // the free area a scene body is fitted into (the assembly below); scenes may read it to pick a layout
      const IS_FULL = D.captions === "full";
      const FRAME_H = IS_FULL ? 900 : 1080; // keywords mode uses the whole frame; full mode keeps the caption band
      // a scene grows to FIT_MAX, or further (to FIT_HARD) until its box spans FIT_FILL of the free width or height,
      // so a small picture does not sit in an empty frame; the free area itself is never exceeded
      const FIT_MAX = 1.6;
      const FIT_FILL = 0.6;
      const FIT_HARD = 2;
      const FIT_X = 120; // side margin, the same as the heading
      const FIT_TOP = 216; // below the heading
      const FIT_BOTTOM = FRAME_H - (IS_FULL ? 24 : 56); // a quiet bottom margin, not an empty band
      const UI_MARGIN = 40; // ui scenes have no heading
      // fill: a scene that sets root.dataset.fit = "fill" (grids of cards) is scaled to FILL_W of the free width
      // (or to the free height, if that is smaller), up or down; it lays out so that this scale keeps text >= 32 px
      const FILL_W = 0.8;
      const FILL_MAX = 2;
      const FREE = { w: 1920 - 2 * FIT_X, h: FIT_BOTTOM - FIT_TOP };

      const el = (tag, cls, parent, css = {}, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        Object.assign(n.style, css);
        if (text !== undefined) n.textContent = text;
        parent.appendChild(n);
        return n;
      };
      const svgEl = (tag, parent, attrs = {}) => {
        const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
        Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
        parent.appendChild(n);
        return n;
      };
      const norm = (w) => w.replace(/[^\w']/g, "").toLowerCase();
      // absolute time of the nth caption word matching token; fail loudly on a data mismatch
      const wordAt = (b, token, nth = 0) => {
        const hits = b.words.filter((w) => norm(w.w) === token.toLowerCase());
        if (hits.length <= nth) throw new Error(`beat ${b.id}: word "${token}" #${nth} not in caption`);
        return hits[nth].s;
      };
      const cue = (b, token, nth = 0) => wordAt(b, token, nth) - LEAD;
      // entrances (popIn, reveal, drawLine), the arrow check and the morph live in motion.js
      // a palette key from the data ("blue", "good", ...) or a literal colour
      const col = (name) => C[name] || name;
      // scene heading: eyebrow, then the headline when a title is given; returns the headline node
      const head = (root, eyebrow, title) => {
        const h = el("div", "abs head", root);
        if (eyebrow) el("div", "t-eyebrow", h, {}, eyebrow);
        return title === undefined ? null : el("div", "t-h1", h, {}, title);
      };
      // key-word label: 2-5 words beside an object, landing LEAD s before its spoken word.
      // spec: {text, word, x, y, align?: left|center|right, color?, kind?: "plain"|"tag", until?: word}; x, y in scene px
      //   until: the label leaves on that word (when the state it names stops being true)
      const keyLabel = (root, b, l, x = l.x, y = l.y) => {
        const n = el("div", "abs key-label " + (l.kind === "tag" ? "tag" : "plain"), root, { left: x + "px", top: y + "px" }, l.text);
        if (l.color) l.kind === "tag" ? (n.style.background = col(l.color)) : (n.style.color = col(l.color));
        const w = Array.isArray(l.word) ? l.word : [l.word];
        const xp = { center: -50, right: -100 }[l.align] || 0; // xPercent keeps the alignment while GSAP moves y
        tl.set(n, { xPercent: xp }, 0);
        reveal(n, cue(b, ...w), l.kind === "tag" ? "card" : "text"); // a tag grows from its edge, plain text rises from a mask
        if (l.until) tl.to(n, { opacity: 0, duration: 0.25, ease: EXIT }, cue(b, ...[].concat(l.until)));
        return n;
      };
      // continuity: beats that share scene.hero get the same element, so the object transforms instead of cutting.
      // heroGroup(b) is the hero's layer, for props that persist across those beats (lanes, tool cards);
      // heroProps(b) is a plain store where one beat leaves those props for the next.
      const HEROES = {};
      const heroLayer = el("div", "abs hero-layer", document.getElementById("stage"));
      const heroId = (b) => {
        if (!b.scene.hero) throw new Error(`beat ${b.id}: scene.hero missing`);
        return b.scene.hero;
      };
      const heroEntry = (b) => {
        const id = heroId(b);
        if (!HEROES[id]) {
          const group = el("div", "abs hero-group", heroLayer);
          HEROES[id] = { group, node: null, props: {} };
        }
        return HEROES[id];
      };
      const heroGroup = (b) => heroEntry(b).group;
      const heroProps = (b) => heroEntry(b).props;
      const hero = (b) => {
        const h = heroEntry(b);
        h.node = h.node || el("div", "abs hero", h.group);
        return h.node;
      };

    </script>
    <script src="motion.js"></script>
    <script src="media.js"></script>
    <script src="scenes.js"></script>
    <script src="scenes-extra.js"></script>
    <script src="events.js"></script>
    <script src="ui.js"></script>
    <!-- CUSTOM:START -->
    <!-- CUSTOM:END -->
    <script>
      // the one paused timeline; helpers above and scenes.js add to it when the build below calls them
      const tl = gsap.timeline({ paused: true });
      // ================= assembly =================
      // the fit (boxOf, fitParams, fitCss) lives in motion.js
      const stage = document.getElementById("stage");
      stage.style.height = FRAME_H + "px";
      heroLayer.style.height = FRAME_H + "px";
      if (!IS_FULL) document.getElementById("band").style.display = "none";
      const bodies = [];
      const roots = [];
      // every fromTo below names each prop in both states: a prop named only in `from` is lost when a seek jumps
      // over the whole tween after an earlier seek reverted it (GSAP renders `from`-only props at the start alone)
      // the transition into a beat (beat.in, default from direction.json). The grammar lives in direction.md:
      // one primary kind for most cuts, one or two accents for chapter changes and the payoff.
      //   calm: the old scene exits, then the new one enters (no overlap)    fade: a short crossfade
      //   cut: a hard cut on the boundary    push: the new scene pushes the old one left (the story moves on)
      //   zoom: zoom through the old scene into the new one (a new chapter)    wipe: the new scene wipes in left to right
      //   morph: a match cut; scene.morph.from (old text) travels into scene.morph.to (new text), see motion.js
      const T = { fade: 0.5, push: 0.7, zoom: 0.6, wipe: 0.6 };
      function transition(prev, root, at, kind, b, prevBeat) {
        const hide = { opacity: 0, duration: 0.01 };
        if (kind === "morph") morphCut(prev, root, at, b, prevBeat);
        else if (kind === "cut") {
          tl.set(prev, { opacity: 0 }, at);
          tl.set(root, { opacity: 1 }, at);
        } else if (kind === "fade") {
          tl.to(prev, { opacity: 0, duration: T.fade, ease: "power1.inOut" }, at - T.fade / 2);
          tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: T.fade, ease: "power1.inOut", immediateRender: false }, at - T.fade / 2);
        } else if (kind === "push") {
          tl.to(prev, { x: -1920, duration: T.push, ease: MOVE }, at - T.push / 2);
          tl.set(prev, { opacity: 0 }, at + T.push / 2);
          tl.fromTo(root, { opacity: 1, x: 1920 }, { opacity: 1, x: 0, duration: T.push, ease: MOVE, immediateRender: false }, at - T.push / 2);
        } else if (kind === "zoom") {
          // a camera dive: the old scene accelerates toward the viewer and cuts out at its peak, then the new one
          // settles from slightly small. They never share the screen, so nothing double-exposes.
          tl.to(prev, { scale: 2.4, duration: T.zoom, ease: "power3.in", transformOrigin: (b.scene && b.scene.zoomAt) || "50% 45%" }, at - T.zoom); // scene.zoomAt: "x% y%" of the old frame to dive into
          tl.set(prev, { opacity: 0 }, at);
          // opacity is in both sets on purpose: a property only in the from-vars is re-read at init, and the capture
          // workers seek out of order, so some frames came out blank (a 5 Hz strobe in the 2026-10-07 trial)
          tl.set(root, { opacity: 1 }, at);
          tl.fromTo(root, { scale: 0.9 }, { scale: 1, duration: T.zoom, ease: ENTER, transformOrigin: "50% 45%", immediateRender: false }, at);
        } else if (kind === "wipe") {
          tl.fromTo(root, { opacity: 1, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: T.wipe, ease: MOVE, immediateRender: false }, at - T.wipe / 2);
          tl.to(prev, hide, at + T.wipe / 2);
        } else {
          tl.to(prev, { opacity: 0, duration: EXIT_DUR, ease: EXIT }, at - EXIT_DUR);
          tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: ENTER_DUR, ease: ENTER, immediateRender: false }, at);
        }
      }
      // the whole build waits for the fonts: every measurement below (fit, wrapped words, arrows, labels) needs the
      // real glyph widths. HyperFrames allows an async build; the timeline is registered only when it is complete.
      loadFonts().then(() => {
        D.beats.forEach((b, i) => {
          const next = D.beats[i + 1];
          const root = el("div", "abs scene", stage, { height: FRAME_H + "px" });
          const type = b.kind === "ui" ? "ui" : b.scene && b.scene.type;
          // custom: a module next to the beats file registers window.SCENES["<file>.js"] (build.py loads it)
          const build = type === "ui" ? sceneUi : window.SCENES[type === "custom" ? b.scene.module : type];
          if (!build) throw new Error(`beat ${b.id}: no scene type "${type}"`);
          build(root, b);
          if (b.kind !== "ui") (b.scene.labels || []).forEach((l) => keyLabel(root, b, l));
          runEvents(root, b); // events.js: word-timed changes on top of the scene
          // the camera wraps the body (not the heading), so an event can push in on part of the scene
          const cam = el("div", "abs scene-body", root, { height: FRAME_H + "px", transformOrigin: "0 0" });
          const body = el("div", "abs scene-body", cam, { height: FRAME_H + "px" });
          [...root.children].filter((n) => n !== cam && !n.classList.contains("head")).forEach((n) => body.appendChild(n));
          bodies.push({ b, body, cam, group: b.scene.hero || b.id, fit: b.kind === "ui" ? (b.scene.eyebrow || b.scene.title ? "ui-head" : "ui") : root.dataset.fit || "fit" });
          roots.push(root);
          if (i === 0) tl.set(root, { opacity: 1 }, 0);
          else transition(roots[i - 1], root, b.start, b.in, b, D.beats[i - 1]);
          // a hero (and its props) leaves with the last beat that names it
          const h = b.scene && b.scene.hero;
          if (h && HEROES[h] && (!next || (next.scene || {}).hero !== h)) {
          const leaveAt = next ? next.start : D.end ? D.end.start : D.total; // the last beat's hero leaves before the end card
          tl.to(HEROES[h].group, { opacity: 0, duration: EXIT_DUR, ease: EXIT }, leaveAt - EXIT_DUR);
        }
        });
        // one fit per group: a lone beat, or every beat that shares a hero plus the hero's layer
        const groups = {};
        bodies.forEach((q) => (groups[q.group] = groups[q.group] || []).push(q));
        Object.entries(groups).forEach(([id, list]) => {
          const nodes = list.flatMap((q) => [...q.body.children]);
          if (HEROES[id]) nodes.push(...HEROES[id].group.children);
          const f = fitParams(boxOf(nodes), list[0].fit);
          list.forEach((q) => {
            q.f = f;
            Object.assign(q.body.style, { transformOrigin: "0 0", transform: fitCss(f) });
          });
          if (HEROES[id]) Object.assign(HEROES[id].group.style, { transformOrigin: "0 0", transform: fitCss(f) });
        });
        stage.appendChild(heroLayer); // heroes draw above every scene

        // captions: one phrase at a time; upcoming words muted, the active word in accent, spoken words in ink
        const band = document.getElementById("band");
        const CAPTION_LEAD = 0.05; // the highlight leads the audio by about one frame and a half
        const SPANS = {}; // caption word spans by beat id and word index, for lift events
        // burned captions only in "full" mode; the VTT is always written
        if (D.captions === "full") D.beats.forEach((b) =>
          b.phrases.forEach((p) => {
            const box = el("div", "abs phrase", band);
            const para = el("p", "", box);
            p.wi.forEach((k, j) => {
              const w = b.words[k];
              if (j) para.appendChild(document.createTextNode(" "));
              const span = el("span", "", para, {}, w.w);
              (SPANS[b.id] = SPANS[b.id] || {})[k] = span;
              // the word brightens as it is spoken; no accent colour, which would collide with the colour roles
              tl.set(span, { color: C.ink }, w.s - CAPTION_LEAD);
            });
            tl.set(box, { opacity: 1 }, p.show);
            tl.set(box, { opacity: 0 }, p.hide);
          }),
        );

        // the end card (direction.json "end"): the last scene clears and the report's name holds on the ground
      if (D.end) {
        const card = el("div", "abs scene", stage, { height: FRAME_H + "px", display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", gap: "24px", textAlign: "center" });
        const title = el("div", "t-display", card, { fontSize: "96px", lineHeight: 1.1, maxWidth: "1500px" }, D.end.title);
        const sub = D.end.sub ? el("div", "t-body mute", card, { fontSize: "40px" }, D.end.sub) : null;
        // CC BY media owe a visible credit (build.py refuses a film without an end card when it has some)
        if (D.end.credits && D.end.credits.length) el("div", "t-label mute", card, { fontSize: "28px", maxWidth: "1500px", marginTop: "24px" }, "Images: " + D.end.credits.join("; "));
        tl.to(roots[roots.length - 1], { opacity: 0, duration: 0.5, ease: EXIT }, D.end.start - 0.5);
        tl.set(card, { opacity: 1 }, D.end.start);
        reveal(title, D.end.start + 0.1, "text");
        if (sub) reveal(sub, D.end.start + 0.5, "text");
      }
      finishEvents(bodies, SPANS); // events.js: camera pushes and caption lifts need the fit and the band

        const morphLayer = el("div", "abs", document.getElementById("root"), { left: 0, top: 0, width: "1920px", height: "1080px" });
        buildMorphs(morphLayer); // motion.js: measures both ends of each match cut in frame px, after the fit
        checkArrows(); // motion.js: console error when an arrow tip lands off its target
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
